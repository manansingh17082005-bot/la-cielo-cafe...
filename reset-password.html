<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset admin password | La Cielo</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="auth-page"><main class="auth-card"><div class="brand-mark">LC</div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Set a new password</h1><p class="muted">Choose a strong password for your admin account.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters"></label><label>Confirm password<input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required placeholder="Repeat password"></label><button class="btn primary full" type="submit">Update password</button></form><p id="message" class="notice" role="status"></p><a class="text-button link-button" href="admin-login.html">Back to admin login</a></main><script>const c=window.LA_CIELO_CONFIG||{};const ready=c.url&&c.anonKey&&!c.url.includes('YOUR_')&&!c.anonKey.includes('YOUR_');const sb=ready?supabase.createClient(c.url,c.anonKey):null;const msg=document.querySelector('#message');document.querySelector('#resetForm').addEventListener('submit',async e=>{e.preventDefault();if(!sb){msg.textContent='Configure Supabase in config.js first.';return}if(newPassword.value!==confirmPassword.value){msg.textContent='Passwords do not match.';return}const {error}=await sb.auth.updateUser({password:newPassword.value});msg.textContent=error?error.message:'Password updated. You can now sign in.';if(!error)setTimeout(()=>location.href='admin-login.html',1800)});</script></body></html>
