<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Cielo Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div id="app" class="app hidden"><aside class="sidebar"><div class="side-brand"><div class="brand-mark">LC</div><div><strong>La Cielo</strong><small>Admin workspace</small></div></div><div class="nav-label">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button><button data-page="settings"><span class="nav-icon">⚙</span>Cafe settings</button><button data-page="menu"><span class="nav-icon">☷</span>Menu manager</button><button data-page="orders"><span class="nav-icon">▤</span>Orders</button><button data-page="bookings"><span class="nav-icon">▦</span>Bookings</button><button data-page="reviews"><span class="nav-icon">☆</span>Reviews</button><button data-page="account"><span class="nav-icon">♙</span>Account & security</button></nav><div class="sidebar-bottom"><button id="viewSite">↗ &nbsp; Customer website</button><button id="logout">⇥ &nbsp; Sign out</button></div></aside><main class="main"><header class="topbar"><div><strong id="topTitle">Overview</strong><div class="muted">La Cielo Cafe & Restaurant</div></div><div class="topuser"><div><strong id="userName">Admin</strong><div class="muted user-email" id="userEmail"></div></div><div class="avatar" id="avatar">A</div></div></header><div class="content" id="content"><p>Loading dashboard…</p></div></main></div><div id="bootMessage" class="auth-page"><main class="auth-card"><div class="brand-mark">LC</div><p class="eyebrow">LA CIELO ADMIN</p><h1>Loading your workspace</h1><p id="bootText" class="muted">Checking secure admin session…</p><a href="admin-login.html">Go to admin login</a></main></div><div id="toast" class="toast hidden" role="status"></div><script>
const c=window.LA_CIELO_CONFIG||{};const configured=c.url&&c.anonKey&&!c.url.includes('YOUR_')&&!c.anonKey.includes('YOUR_');const sb=configured?supabase.createClient(c.url,c.anonKey):null;const $=s=>document.querySelector(s);let currentUser=null,settingsRow=null,menuRows=[];const content=$('#content');function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function val(o,k,d=''){return esc(o?.[k]??d)}
async function boot(){if(!sb){$('#bootText').textContent='Supabase is not configured. Copy config.example.js to config.js and add your project URL and publishable/anon key.';return}const {data:{session}}=await sb.auth.getSession();if(!session){location.href='admin-login.html';return}currentUser=session.user;const {data:admin,error}=await sb.from('admin_users').select('user_id').eq('user_id',currentUser.id).maybeSingle();if(error||!admin){await sb.auth.signOut();$('#bootText').textContent='This account is not authorised. Ask the project owner to grant admin access.';return}$('#bootMessage').classList.add('hidden');$('#app').classList.remove('hidden');$('#userName').textContent=currentUser.user_metadata?.full_name||'Administrator';$('#userEmail').textContent=currentUser.email||'';$('#avatar').textContent=(currentUser.email||'A').charAt(0).toUpperCase();await render('overview')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;$('#nav').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.page)});$('#logout').onclick=async()=>{await sb.auth.signOut();location.href='admin-login.html'};$('#viewSite').onclick=()=>location.href='index.html';
function shell(title,sub,html){$('#topTitle').textContent=title;content.innerHTML=`<div class="welcome"><div><h1 class="page-title">${title}</h1><p class="subhead">${sub}</p></div></div>${html}`}
async function loadSettings(){const {data,error}=await sb.from('cafe_settings').select('*').eq('id',1).maybeSingle();if(error)throw error;if(!data){const {data:inserted,error:ie}=await sb.from('cafe_settings').insert({id:1,cafe_name:'La Cielo Cafe & Restaurant',phone:'099999 55345',address:'Top floor, Atlantic tower Samachar market, Mayur Vihar Phase 1 Extension, Mayur Vihar, Delhi, 110091',opening_hours:'Please update opening hours',currency:'INR'}).select().single();if(ie)throw ie;settingsRow=inserted}else settingsRow=data;return settingsRow}
async function render(page){try{if(page==='overview')return await overview();if(page==='settings')return await settings();if(page==='menu')return await menu();if(page==='orders')return await records('orders');if(page==='bookings')return await records('bookings');if(page==='reviews')return await records('reviews');if(page==='account')return account()}catch(e){shell('Something needs attention','The dashboard could not load this section.',`<div class="card"><p class="notice error">${esc(e.message||e)}</p><p class="help">Check that you ran the supplied supabase/schema.sql in your Supabase project and that this admin account is listed in admin_users.</p><button class="btn secondary" onclick="render('${page}')">Try again</button></div>`)}}
async function overview(){let stats=[];for(const [table,label] of [['orders','Orders'],['bookings','Bookings'],['reviews','Reviews']]){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});stats.push({label,count:error?'—':count})}const {count:items}=await sb.from('menu_items').select('*',{count:'exact',head:true});shell('Good to see you','Here is what is happening at your cafe today.',`<div class="grid stats">${stats.map(x=>`<div class="card"><div class="stat-label">Total ${x.label.toLowerCase()}</div><div class="stat-value">${x.count??'—'}</div><div class="stat-note">Live count from your database</div></div>`).join('')}<div class="card"><div class="stat-label">Menu items</div><div class="stat-value">${items??'—'}</div><div class="stat-note">Manage availability and pricing</div></div></div><div class="grid section-grid"><section class="card"><div class="card-head"><h2>Quick actions</h2></div><div class="quick-actions"><button data-go="settings"><span>⚙</span><span><b>Update cafe details</b><small>Phone, address, timings</small></span></button><button data-go="menu"><span>＋</span><span><b>Add a menu item</b><small>Manage dishes and prices</small></span></button><button data-go="orders"><span>▤</span><span><b>View orders</b><small>Check customer orders</small></span></button><button data-go="account"><span>♙</span><span><b>Account security</b><small>Password and sign-in</small></span></button></div></section><section class="card"><div class="card-head"><h2>Admin workspace</h2><span class="pill">Secure session</span></div><p class="muted">Manage the customer-facing website without editing HTML. Changes to settings and menu items are saved in Supabase.</p><p class="help">For customer orders and bookings to work end-to-end, the public ordering forms must also be connected to the same database.</p></section></div>`);content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=b.dataset.go;$('#nav').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p)})}
async function settings(){const s=await loadSettings();shell('Cafe settings','Update the information customers see on your website. No code editing needed.',`<div class="card"><div class="card-head"><h2>Business information</h2><span class="pill">Editable</span></div><form id="settingsForm"><div class="form-grid"><label>Cafe name<input name="cafe_name" required value="${val(s,'cafe_name')}"></label><label>Tagline<input name="tagline" value="${val(s,'tagline')}"></label><label>Contact phone<input name="phone" value="${val(s,'phone')}"></label><label>WhatsApp number<input name="whatsapp" placeholder="Country code + number" value="${val(s,'whatsapp')}"><span class="help">Example: 919999955345 (numbers only).</span></label><label class="field-full">Full address<textarea name="address">${val(s,'address')}</textarea></label><label>Contact email<input name="email" type="email" value="${val(s,'email')}"></label><label>Opening hours<input name="opening_hours" value="${val(s,'opening_hours')}"></label><label>Instagram URL<input name="instagram_url" type="url" value="${val(s,'instagram_url')}"></label><label>Google Maps URL<input name="maps_url" type="url" value="${val(s,'maps_url')}"></label><label>Delivery charge (₹)<input name="delivery_charge" type="number" min="0" step="0.01" value="${val(s,'delivery_charge','0')}"></label><label>Minimum order (₹)<input name="minimum_order" type="number" min="0" step="0.01" value="${val(s,'minimum_order','0')}"></label><label>Website accent colour<input name="accent_color" type="color" value="${/^#[0-9a-f]{6}$/i.test(s.accent_color||'')?s.accent_color:'#244f3b'}"></label><label class="field-full">Logo image URL<input name="logo_url" type="url" value="${val(s,'logo_url')}"><span class="help">Paste a publicly accessible image URL. Direct photo uploads can be added after Storage is configured.</span></label></div><div class="form-actions"><button type="button" class="btn secondary" id="reloadSettings">Discard changes</button><button class="btn primary" type="submit">Save changes</button></div><p id="settingsMsg" class="notice" role="status"></p></form></div>`);$('#reloadSettings').onclick=()=>settings();$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload=Object.fromEntries(f.entries());payload.id=1;payload.delivery_charge=Number(payload.delivery_charge||0);payload.minimum_order=Number(payload.minimum_order||0);const {error}=await sb.from('cafe_settings').upsert(payload,{onConflict:'id'});if(error){$('#settingsMsg').textContent=error.message;$('#settingsMsg').className='notice error'}else{$('#settingsMsg').textContent='Saved! Cafe settings have been updated in the database.';$('#settingsMsg').className='notice info';toast('Cafe settings saved')}}}
async function menu(){const {data,error}=await sb.from('menu_items').select('*').order('category').order('name');if(error)throw error;menuRows=data||[];shell('Menu manager','Add dishes, update prices and mark items unavailable.',`<div class="card"><div class="toolbar"><input id="menuSearch" placeholder="Search menu items…"><button class="btn primary" id="addMenu">＋ Add item</button></div><div id="menuEditor" class="hidden"></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${menuRows.length?menuRows.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.category||'—')}</td><td>₹${Number(m.price||0).toFixed(2)}</td><td><span class="pill">${m.available?'Available':'Unavailable'}</span></td><td><div class="row-actions"><button class="small-btn" data-edit="${m.id}">Edit</button><button class="small-btn" data-toggle="${m.id}">${m.available?'Disable':'Enable'}</button></div></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No menu items yet. Add the first item.</div></td></tr>'}</tbody></table></div></div>`);const editor=$('#menuEditor');function edit(item={name:'',category:'',description:'',price:'',image_url:'',available:true}){editor.classList.remove('hidden');editor.innerHTML=`<form id="menuForm" class="card" style="margin-bottom:18px"><h2>${item.id?'Edit menu item':'New menu item'}</h2><div class="form-grid" style="margin-top:16px"><label>Item name<input name="name" required value="${val(item,'name')}"></label><label>Category<input name="category" value="${val(item,'category')}" placeholder="Coffee, Main course…"></label><label>Price (₹)<input name="price" type="number" min="0" step="0.01" required value="${val(item,'price')}"></label><label>Photo URL<input name="image_url" type="url" value="${val(item,'image_url')}"></label><label class="field-full">Description<textarea name="description">${val(item,'description')}</textarea></label><label><span>Availability</span><select name="available"><option value="true" ${item.available!==false?'selected':''}>Available</option><option value="false" ${item.available===false?'selected':''}>Unavailable</option></select></label></div><div class="form-actions"><button type="button" class="btn secondary" id="cancelMenu">Cancel</button><button class="btn primary">Save item</button></div><p id="menuMsg" class="notice"></p></form>`;$('#cancelMenu').onclick=()=>editor.classList.add('hidden');$('#menuForm').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target).entries());p.price=Number(p.price);p.available=p.available==='true';let result;if(item.id)result=await sb.from('menu_items').update(p).eq('id',item.id);else result=await sb.from('menu_items').insert(p);if(result.error){$('#menuMsg').textContent=result.error.message;$('#menuMsg').className='notice error'}else{toast('Menu item saved');await menu()}}}$('#addMenu').onclick=()=>edit();content.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(menuRows.find(m=>String(m.id)===b.dataset.edit)));content.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const m=menuRows.find(x=>String(x.id)===b.dataset.toggle);const {error}=await sb.from('menu_items').update({available:!m.available}).eq('id',m.id);if(error)toast(error.message);else await menu()});$('#menuSearch').oninput=e=>{const q=e.target.value.toLowerCase();content.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(q)))}}
async function records(table){const meta={orders:{title:'Orders',sub:'Review orders stored in your database.',cols:['id','customer_name','phone','fulfilment','status','created_at']},bookings:{title:'Bookings',sub:'Review customer table booking requests.',cols:['id','customer_name','phone','booking_date','party_size','status']},reviews:{title:'Reviews',sub:'Review customer feedback and moderation status.',cols:['id','customer_name','rating','review_text','status','created_at']}}[table];const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;const rows=data||[];const labels={id:'ID',customer_name:'Customer',phone:'Phone',fulfilment:'Fulfilment',status:'Status',created_at:'Created',booking_date:'Date',party_size:'Guests',rating:'Rating',review_text:'Review'};shell(meta.title,meta.sub,`<div class="card"><div class="toolbar"><p class="muted">Showing up to 100 recent records</p><button class="btn secondary" id="refreshRecords">Refresh</button></div><div class="table-wrap"><table><thead><tr>${meta.cols.map(c=>`<th>${labels[c]||c}</th>`).join('')}<th>Update status</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${meta.cols.map(c=>`<td>${c==='created_at'&&r[c]?esc(new Date(r[c]).toLocaleString()):esc(r[c]??'—')}</td>`).join('')}<td><select data-status-table="${table}" data-status-id="${esc(r.id)}"><option value="">Choose…</option>${(table==='orders'?['new','confirmed','preparing','ready','completed','cancelled']:table==='bookings'?['pending','confirmed','completed','cancelled']:['pending','approved','hidden']).map(x=>`<option value="${x}" ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">No records found yet.</div></td></tr>'}</tbody></table></div><p class="help">This panel can display records only after the public website forms have been connected to the same Supabase tables.</p></div>`);$('#refreshRecords').onclick=()=>records(table);content.querySelectorAll('[data-status-table]').forEach(sel=>sel.onchange=async()=>{if(!sel.value)return;const {error}=await sb.from(table).update({status:sel.value}).eq('id',sel.dataset.statusId);if(error){toast(error.message);return}toast('Status updated')})}
function account(){shell('Account & security','Keep admin access private and recover your account securely.',`<div class="grid section-grid"><section class="card"><h2>Signed-in account</h2><p>${esc(currentUser.email||'')}</p><p class="help">Only accounts listed in the admin_users table should be authorised to use this workspace.</p><button class="btn secondary" id="sendReset">Email me a password reset link</button><p id="accountMsg" class="notice"></p></section><section class="card"><h2>Security checklist</h2><p>✓ Password is managed by Supabase Auth.</p><p>✓ Admin pages check the signed-in account and admin allow-list.</p><p>✓ Database access is restricted by Row Level Security policies.</p><p class="help">Never share your Supabase secret/service-role key or store admin passwords in website files.</p></section></div>`);$('#sendReset').onclick=async()=>{const {error}=await sb.auth.resetPasswordForEmail(currentUser.email,{redirectTo:location.origin+location.pathname.replace('admin.html','reset-password.html')});$('#accountMsg').textContent=error?error.message:'If your account email is valid, a password reset email will arrive shortly.';$('#accountMsg').className='notice '+(error?'error':'info')}}
sb?.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')location.href='reset-password.html'});boot();
</script></body></html>
