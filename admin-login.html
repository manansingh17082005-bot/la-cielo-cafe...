<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Cielo Admin Login</title><style>body{font:16px system-ui;background:#f7f3eb;color:#21342c;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:28px;border-radius:16px;width:min(390px,90vw);box-shadow:0 10px 35px #0001}label{display:block;margin:12px 0 5px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}button{margin-top:16px;padding:12px 16px;background:#173b31;color:white;border:0;border-radius:8px;width:100%;cursor:pointer}.muted{color:#66736b;font-size:13px}#msg{white-space:pre-wrap}</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="box"><h1>La Cielo Admin</h1><p class="muted">For authorized cafe staff only.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"><button>Sign in securely</button></form><p id="msg" role="status"></p><p class="muted">Admin accounts must be created by the project owner and added to the admin_users table. Public sign-up is intentionally disabled.</p></main><script>
const msg=document.getElementById('msg');
if(!window.LACIELO_CONFIG || window.LACIELO_CONFIG.SUPABASE_URL.includes('YOUR_PROJECT')){msg.textContent='Setup required: copy config.example.js to config.js and add your Supabase project URL and publishable key.';document.getElementById('login').querySelector('button').disabled=true;}
else {
 const client=window.supabase.createClient(window.LACIELO_CONFIG.SUPABASE_URL,window.LACIELO_CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent='Sign-in failed. Check your credentials or contact the site administrator.';return;}const {data:admin,error:adminErr}=await client.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminErr||!admin){await client.auth.signOut();msg.textContent='This account is not authorized as a cafe admin.';return;}msg.textContent='Authenticated. Next step: connect the admin dashboard module.';});
}
</script></body></html>
