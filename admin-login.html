<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Cielo | Admin Login</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">LC</div><p class="eyebrow">LA CIELO CAFE & RESTAURANT</p><h1>Admin sign in</h1><p class="muted">Sign in to manage the cafe website.</p><form id="loginForm"><label>Email address<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="btn primary full" type="submit">Sign in</button></form><button class="text-button" id="forgotBtn" type="button">Forgot password?</button><p id="message" class="notice" role="status"></p><p class="tiny muted">Authorised staff only. Customer accounts are not required.</p></main><script>
const cfg=window.LA_CIELO_CONFIG||{};const ready=cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_')&&!cfg.anonKey.includes('YOUR_');const sb=ready?supabase.createClient(cfg.url,cfg.anonKey):null;const msg=document.querySelector('#message');function say(t,kind=''){msg.textContent=t;msg.className='notice '+kind;}
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!sb)return say('Setup required: add your Supabase project URL and publishable/anon key in config.js.','error');say('Signing in…');const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return say(error.message,'error');const {data:admin,error:adminError}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){await sb.auth.signOut();return say('This account is not authorised as a cafe admin.','error')}location.href='admin.html';});
document.querySelector('#forgotBtn').addEventListener('click',async()=>{if(!sb)return say('Set up Supabase in config.js first.','error');const address=email.value.trim();if(!address)return say('Enter your admin email first.','error');say('Sending reset email…');const {error}=await sb.auth.resetPasswordForEmail(address,{redirectTo:location.origin+location.pathname.replace('admin-login.html','reset-password.html')});say(error?error.message:'If this email belongs to an account, a password reset link will be sent. Check your inbox.','info')});
</script></body></html>
